<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellular Automata Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v=5">
</head>
<body>

    <!-- Tab Buttons -->
    <div class="tab-bar">
        <button class="tab-link active" onclick="openTab(event, 'Simulation')">Simulation</button>
        <button class="tab-link" onclick="openTab(event, 'Morphological')">Morphological</button>
        <button class="tab-link" onclick="openTab(event, 'FindTriangles')">Find Triangles</button>
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="theme-toggle">
                <input type="checkbox" id="theme-toggle" />
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- Tab 1: Simulation -->
    <div id="Simulation" class="tab-content main-content" style="display: flex;">
        <div id="left-menu" class="tab-left-panel">
            <h2>Parameters</h2>
            <form id="param-form">
                <div>
                    <label for="rule-select">
                        Rule 
                        <span class="info-icon" data-info="Select the cellular automaton rule to simulate."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <select name="rule" id="rule-select"></select>
                </div>
                <div>
                    <label for="init-method-select">
                        Init Method
                        <span class="info-icon" data-info="Select the initialization method: 'single_cell' for a single live cell, 'random' for random initialization."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <select name="init_method" id="init-method-select"></select>
                </div>
                <div>
                    <label for="cell-space-input">
                        Cell Space
                        <span class="info-icon" data-info="Size of the simulation grid in cells."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <input type="number" id="cell-space-input" name="cell_space" value="300" required>
                </div>
                <div>
                    <label for="num-evolutions-input">
                        Evolutions
                        <span class="info-icon" data-info="Number of generations to simulate."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <input type="number" id="num-evolutions-input" name="num_evolutions" value="150" required>
                </div>
                <div id="density-container">
                    <label for="density-input">
                        Percentage (%)
                        <span class="info-icon" data-info="For Random init method. Value between 0 and 1 (0.5 = 50%)."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <input type="number" id="density-input" name="density" min="0" max="1" step="0.01" value="0.5">
                </div>
                <div id="seed-container" style="display:none;">
                    <label for="seed-input">
                        Seed
                        <span class="info-icon" data-info="Binary string of 0s and 1s used as the initial state, centered in the grid. Only 0 and 1 characters are allowed."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <input type="text" id="seed-input" name="seed"
                           value="0001000"
                           placeholder="e.g. 0001000"
                           maxlength="300"
                           autocomplete="off"
                           spellcheck="false">
                </div>
                <div>
                    <label for="print-method-select">
                        Print Method
                        <span class="info-icon" data-info="Select the backend library to generate the image. This is for demonstration purposes."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <select name="print_method" id="print-method-select"></select>
                </div>
                <div id="pixel_size">
                    <label for="pixel-size-input">
                        Pixel Size
                        <span class="info-icon" data-info="Sets the size of each cell in pixels for the output image."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <div class="stepper">
                        <button type="button" class="stepper-btn" onclick="stepPixelSize(-1, 'pixel-size-input')">−</button>
                        <input type="number" id="pixel-size-input" name="pixel_size" value="1" min="1" max="15" required>
                        <button type="button" class="stepper-btn" onclick="stepPixelSize(1, 'pixel-size-input')">+</button>
                    </div>
                </div>
                <button type="submit">Send</button>
                <button type="button" id="save-image-btn" class="btn-success" style="display:none;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Save Image</button>
            </form>
        </div>
        <div id="right-panel" class="tab-right-panel">
            <!-- Canvas Controls -->
            <div class="canvas-controls">
                <div class="controls-group">
                    <button id="zoomInBtn" class="btn-zoom-in" title="Zoom In (or scroll up)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <button id="zoomOutBtn" class="btn-zoom-out" title="Zoom Out (or scroll down)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <button id="resetBtn" class="btn-reset" title="Reset zoom and pan">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
                    </button>
                </div>
                <div class="zoom-display" id="zoomDisplay">Zoom: 100%</div>
            </div>
            
            <!-- Canvas -->
            <div class="canvas-container">
                <canvas id="image-canvas" width="800" height="600"></canvas>
            </div>
        </div>
    </div>
    <!-- Tab 2: Morphological -->
    <div id="Morphological" class="tab-content main-content" style="display: none;">
        <div id="morph-left-menu" class="tab-left-panel">
            <h2>Morphological Operations</h2>
            <form id="morph-form" onsubmit="handleMorphSubmit(event)">
                <div>
                    <label for="morph-operation-select">
                        Operation
                        <span class="info-icon" data-info="Select the morphological operation to apply."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <select name="operation" id="morph-operation-select">
                        {% for op in morphology_operations %}
                        <option value="{{ op }}">{{ op }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="morph-kernel-select">
                        Kernel
                        <span class="info-icon" data-info="Structuring element used for the morphological operation."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <select name="kernel" id="morph-kernel-select">
                        {% for k in kernel_options %}
                        <option value="{{ k }}">{{ k }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="morph-iterations-input">
                        Iterations
                        <span class="info-icon" data-info="Number of times to apply the operation."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <input type="number" id="morph-iterations-input" name="iterations" value="1" min="1" required>
                </div>
                <div>
                    <label for="morph-pixel-size-input">
                        Pixel Size
                        <span class="info-icon" data-info="Sets the size of each cell in pixels for the output image."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <div class="stepper">
                        <button type="button" class="stepper-btn" onclick="stepPixelSize(-1, 'morph-pixel-size-input')">−</button>
                        <input type="number" id="morph-pixel-size-input" name="pixel_size" value="1" min="1" max="15" required>
                        <button type="button" class="stepper-btn" onclick="stepPixelSize(1, 'morph-pixel-size-input')">+</button>
                    </div>
                </div>
                <button type="submit">Apply</button>
                <button type="button" onclick="copySimulationToMorphCanvas()" class="btn-secondary"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg> Reset</button>
                <button type="button" onclick="saveMorphImage()" class="btn-success"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Save Image</button>
            </form>
        </div>
        <div id="morph-right-panel" class="tab-right-panel">
            <div class="canvas-controls">
                <div class="controls-group">
                    <button id="zoomInBtnMorph" class="btn-zoom-in" title="Zoom In (or scroll up)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <button id="zoomOutBtnMorph" class="btn-zoom-out" title="Zoom Out (or scroll down)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <button id="resetBtnMorph" class="btn-reset" title="Reset zoom and pan">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
                    </button>
                </div>
                <div class="zoom-display" id="zoomDisplayMorph">Zoom: 100%</div>
            </div>
            <div class="canvas-container">
                <canvas id="morph-canvas" width="800" height="600"></canvas>
            </div>
        </div>  <!-- closes morph-right-panel -->
    </div>  <!-- closes #Morphological -->

    <!-- Tab 3: Filters -->
    <div id="FindTriangles" class="tab-content main-content" style="display: none;">
        <div id="filters-left-menu" class="tab-left-panel">
            <h2>Find Triangles</h2>
            <form id="filters-form" onsubmit="handleFiltersSubmit(event)">
                <div>
                    <label for="filters-pixel-size-input">
                        Pixel Size
                        <span class="info-icon" data-info="Sets the size of each cell in pixels for the output image."><svg width="10" height="12" viewBox="0 0 10 13" fill="white" aria-hidden="true"><rect x="4" y="5" width="2" height="7" rx="1"/><circle cx="5" cy="2" r="1.5"/></svg></span>
                    </label>
                    <div class="stepper">
                        <button type="button" class="stepper-btn" onclick="stepPixelSize(-1, 'filters-pixel-size-input')">−</button>
                        <input type="number" id="filters-pixel-size-input" name="pixel_size" value="1" min="1" max="15" required>
                        <button type="button" class="stepper-btn" onclick="stepPixelSize(1, 'filters-pixel-size-input')">+</button>
                    </div>
                </div>
                <button type="submit">Apply</button>
                <button type="button" onclick="saveFiltersImage()" class="btn-success"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Save Image</button>
                <button type="button" onclick="showHistogram()" class="btn-info-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg> Histogram</button>
            </form>
        </div>
        <div id="filters-right-panel" class="tab-right-panel">
            <div class="canvas-controls">
                <div class="controls-group">
                    <button id="zoomInBtnFilters" class="btn-zoom-in" title="Zoom In (or scroll up)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <button id="zoomOutBtnFilters" class="btn-zoom-out" title="Zoom Out (or scroll down)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <button id="resetBtnFilters" class="btn-reset" title="Reset zoom and pan">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
                    </button>
                </div>
                <div class="zoom-display" id="zoomDisplayFilters">Zoom: 100%</div>
            </div>
            <div class="canvas-container">
                <canvas id="filters-canvas" width="800" height="600"></canvas>
            </div>
        </div>  <!-- closes filters-right-panel -->
    </div>  <!-- closes #Filters -->

    <!-- Info Popup Container -->
    <div id="info-popup"></div>

    <!-- Backend Data - Keep inline to use Jinja2 template variables -->
    <script>
        const backendData = {
            rules: {{ rules | tojson }},
            init_methods: {{ init_methods | tojson }},
            print_methods: {{ print_methods | tojson }},
            morphology_operations: {{ morphology_operations | tojson }},
            kernel_options: {{ kernel_options | tojson }}
        };

        // --- Global pixel size shared across all sections ---
        window.globalPixelSize = 1;
        window.rawSimImage     = null;  // unscaled sim image, input for morph/filter ops
        window.morphRawImage   = null;  // unscaled result of last morph op (chains correctly)
        window.filtersRawImage = null;  // unscaled image shown in the Filters tab

        // Every pixel-size input that must stay in sync
        window.PIXEL_SIZE_INPUTS = [
            'pixel-size-input',
            'morph-pixel-size-input',
            'filters-pixel-size-input'
        ];

        function syncPixelSize(sourceId) {
            const input = document.getElementById(sourceId);
            let value = parseInt(input.value, 10) || 1;
            value = Math.max(1, Math.min(15, value));
            input.value = value;
            window.globalPixelSize = value;
            window.PIXEL_SIZE_INPUTS.forEach(id => {
                const el = document.getElementById(id);
                if (el && id !== sourceId) el.value = value;
            });
            // Re-render all canvases with the new pixel size immediately
            if (typeof window.applyPixelSizeToCanvases === 'function') {
                window.applyPixelSizeToCanvases();
            }
        }

        function stepPixelSize(delta, sourceId) {
            const input = document.getElementById(sourceId);
            input.value = (parseInt(input.value, 10) || 1) + delta;
            syncPixelSize(sourceId);
        }

        function copySimulationToMorphCanvas() {
            // Reset morphRawImage to the raw sim image so morph ops start clean
            if (window.rawSimImage) {
                window.morphRawImage = window.rawSimImage;
            }
            const srcCanvas = document.getElementById('image-canvas');
            if (!srcCanvas) return;
            const img = new Image();
            img.onload = function () {
                if (window.morphSetImage) window.morphSetImage(img);
            };
            img.src = srcCanvas.toDataURL('image/png');
        }

        function copyMorphToFiltersCanvas() {
            // Filters starts from the Morphological result; if no morphological
            // operation has run yet, fall back to the raw simulation image.
            const rawSource = window.morphRawImage || window.rawSimImage;
            if (!rawSource) return;
            window.filtersRawImage = rawSource;

            // Prefer the morph canvas pixels; fall back to the simulation canvas
            const srcCanvas = (window.morphRawImage
                ? document.getElementById('morph-canvas')
                : document.getElementById('image-canvas'));
            if (!srcCanvas) return;

            const img = new Image();
            img.onload = function () {
                if (window.filtersSetImage) window.filtersSetImage(img);
            };
            img.src = srcCanvas.toDataURL('image/png');
        }

        function openTab(evt, tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-link').forEach(el => el.classList.remove('active'));
            const tabElement = document.getElementById(tabName);
            if (tabElement) tabElement.style.display = 'flex';
            evt.currentTarget.classList.add('active');
            if (tabName === 'Morphological') copySimulationToMorphCanvas();
            if (tabName === 'FindTriangles') copyMorphToFiltersCanvas();
        }

        async function generateMorphologicalTransformation(operation, kernel, iterations, pixel_size = 1) {
            // Always operate on the unscaled raw image so pixel_size is applied cleanly
            const imageData = window.morphRawImage;
            if (!imageData) { alert('No simulation image available. Generate one first.'); return; }

            try {
                const response = await fetch('/generate_morphological', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_data: imageData, operation, kernel, iterations, pixel_size })
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                // Store the raw (unscaled) result for chaining future operations
                window.morphRawImage = data.raw_image_data;

                // Display the scaled result on the morph canvas
                const img = new Image();
                img.onload = function () {
                    if (window.morphSetImage) window.morphSetImage(img);
                };
                img.src = data.image_data;
            } catch (err) {
                console.error('Morphological error:', err);
                alert('Error applying morphological operation: ' + err);
            }
        }

        function handleMorphSubmit(event) {
            event.preventDefault();
            const operation  = document.getElementById('morph-operation-select').value;
            const kernel     = document.getElementById('morph-kernel-select').value;
            const iterations = parseInt(document.getElementById('morph-iterations-input').value, 10);
            generateMorphologicalTransformation(operation, kernel, iterations, window.globalPixelSize);
        }

        // ---------- Filters tab ----------

        // Apply button — placeholder, implement the filter pipeline here
        function handleFiltersSubmit(event) {
            event.preventDefault();
            applyFilter();
        }

        async function applyFilter() {
            const rawSource = window.filtersRawImage || window.morphRawImage || window.rawSimImage;
            if (!rawSource) {
                alert('No image available. Generate a simulation first.');
                return;
            }
            try {
                const response = await fetch('/find_triangles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image_data: rawSource,
                        pixel_size: window.globalPixelSize || 1
                    })
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                window.filtersRawImage = data.raw_image_data;

                const img = new Image();
                img.onload = function () {
                    if (window.filtersSetImage) window.filtersSetImage(img);
                };
                img.src = data.image_data;

                console.log('✓ Triangles found:', data.triangle_count);
            } catch (err) {
                console.error('Find triangles error:', err);
                alert('Error finding triangles: ' + err);
            }
        }

        function showHistogram() {
            console.log('showHistogram() — not implemented yet.');
        }

        function saveMorphImage() {
            const canvas = document.getElementById('morph-canvas');
            if (!canvas) return;
            const url = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = url;
            a.download = 'morphological_' + Date.now() + '.png';
            a.click();
        }

        function saveFiltersImage() {
            const canvas = document.getElementById('filters-canvas');
            if (!canvas) return;
            const url = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = url;
            a.download = 'find_triangles_' + Date.now() + '.png';
            a.click();
        }
    </script>

    <script src="/static/script.js?v=9"></script>
</body>
</html>
